usage: |
  应用访问地址：https://{{ .S.AppDomain }}
  首次打开后，请在 Happy 客户端中配置此 Happy Server 地址；
  服务端数据持久保存在 /lzcapp/var/data。
application:
  subdomain: happyweb
  secondary_domains:
    - happyserver
  background_task: true
  public_path:
    - /
  routes:
    - /=http://happycoder.cloud.lazycat.app.happycoder.lzcapp:80
services:
  happycoder:
    # lazycat-action replaces this staging reference with the copied official
    # image before each real LPK build.
    # upstream: ttl.sh/lazycat-happycoder-11df01d37b18:24h@sha256:753f9f490e8122695ac18a13b5cb741a3f9c3acb5719e4b76b544c8699f24500
    image: registry.lazycat.cloud/peter/lazycat-happycoder-11df01d37b18:b898dafbc6c48001
    environment:
      NODE_ENV: production
      PORT: "3005"
      PUBLIC_URL: https://happyserver.${LAZYCAT_BOX_DOMAIN}
      HANDY_MASTER_SECRET: '{{ .U.HANDY_MASTER_SECRET }}'
    binds:
      - /lzcapp/var/data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost/health
      interval: 30s
      timeout: 5s
      retries: 5
