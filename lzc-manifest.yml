usage: |
  应用访问地址：https://{{ .S.AppDomain }}
  首次打开后，请在 Happy 客户端中配置此 Happy Server 地址；
  服务端数据持久保存在 /lzcapp/var/data。
application:
  subdomain: happyweb
  secondary_domains:
    - happyserver
  background_task: true
  public_path:
    - /
  routes:
    - /=http://happycoder.cloud.lazycat.app.happycoder.lzcapp:80
services:
  happycoder:
    # lazycat-action replaces this staging reference with the copied official
    # image before each real LPK build.
    # upstream: ttl.sh/lazycat-happycoder-ac1f78281a61:24h@sha256:6d739fc62e57ea211d99efbcefe44b44689d089f60c591620468b9e5b379d5bb
    image: registry.lazycat.cloud/peter/lazycat-happycoder-ac1f78281a61:4774727684747deb
    environment:
      NODE_ENV: production
      PORT: "3005"
      PUBLIC_URL: https://happyserver.${LAZYCAT_BOX_DOMAIN}
      HANDY_MASTER_SECRET: '{{ .U.HANDY_MASTER_SECRET }}'
    binds:
      - /lzcapp/var/data:/data
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost/health
      interval: 30s
      timeout: 5s
      retries: 5
