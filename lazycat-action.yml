version: 2
project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: dist/cloud.lazycat.app.happycoder.lpk
  target_arch: amd64
source:
  kind: git
  url: https://github.com/slopus/happy.git
  select:
    strategy: semver-tag
    # The v* tags are the app/server releases. CLI-only tags use cli-* and
    # must not trigger a new LazyCat web/server package.
    tag_regex: '^v[0-9]+\.[0-9]+\.[0-9]+$'
changelog:
  mode: git-commits
  git_url: https://github.com/slopus/happy.git
state:
  file: .lazycat-action.lock.yml
update:
  strategy: publish
  allow_downgrade: false
build:
  run_buildscript: true
  prepare:
    mode: command
    context: image
    command: python3 -B image/prepare.py
    # ttl.sh is an anonymous staging registry. LazyCat copies the tested
    # image into its permanent registry before the LPK is built.
    output_image: ttl.sh/lazycat-happycoder-{fingerprint}:24h
images:
  - id: app
    target: service
    service: app
    source: ttl.sh/lazycat-happycoder
    delivery:
      mode: lazycat
      copy_timeout: 45m
      copy_idle_timeout: 15m
stores:
  official:
    enabled: true
    skip_if_version_exists: true
    continue_if_newer_version: true
    create_if_missing: false
